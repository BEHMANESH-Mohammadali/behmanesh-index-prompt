name: BSI v3.5 validation

on:
  push:
    branches:
      - "migration/**"
      - "feat/bsi-v3.5-scoring-engine"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-package-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi uvicorn requests
      - name: Compile Python modules
        run: python -m compileall -q api core
      - name: Run repository test suite
        run: python -m pytest -q
